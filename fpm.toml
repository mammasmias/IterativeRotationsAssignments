name = "ira"
version = "version.txt"

[library]
type = ["static", "shared"]
source-dir = "src"
include-dir = ["lap_local"]

[fortran]
implicit-external = true
source-form="default"

[dependencies]

[preprocess]
[preprocess.cpp]
macros = ["STRVERSION=\\\"2.2.0\\\"", "DATEVERSION=20250911" ]

[features]
optimized.flags = "-ffree-line-length-0 -fPIC -O2"

[profiles]
release=["optimized"]

[install]
library=true

