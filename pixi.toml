[project]
authors = ["MAMMASMIAS Consortium"]
channels = ["conda-forge"]
description = "Algorithms for Iterative Rotations and Assignments (IRA), and the Symmetry Operations FInder (SOFI)."
name = "IterativeRotationsAssignments"
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]
version = "2.2.0"

[tasks]
build_lib = { cmd = "make all", cwd = "src" }
build_fpm = "fpm build --profile lapack-release"
build_cmake = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build"

[activation]
env = { PYTHONPATH = "$PYTHONPATH:$(pwd)/interface" }

[dependencies]
openblas = ">=0.3.28,<0.4"
python = ">=3.13.1,<3.14"
pip = ">=24.3.1,<25"
fortran-compiler = ">=1.9.0,<2"
make = ">=4.4.1,<5"
numpy = "*"
fpm = ">=0.13,<0.14"
cmake = ">=3.21"
ninja = "*"
pkg-config = "*"
