  // Keyed by e.g. "C3", "S0": each entry collects every shape/label that
  // belongs to that operation, so a single checkbox can show/hide all of
  // them together.
  var symGroups = {};
  function symGroup(key, color) {
    if (!symGroups[key]) {
      symGroups[key] = { shapes: [], labelRefs: [], labelSpecs: [], color: color };
    }
    return symGroups[key];
  }

  // ---- Arrows: proper rotation (Cn) symmetry axes -------------------------
  arrows.forEach(function (spec) {
    var shp = viewer.addArrow({
      start: spec.start,
      end: spec.end,
      radius: spec.radius,
      color: spec.color,
      radiusRatio: spec.radiusRatio,
      mid: spec.mid
    });
    var grp = spec.group ? symGroup(spec.group, spec.color) : null;
    if (grp) { grp.shapes.push(shp); }
    if (spec.label) {
      var labelOpts = {
        position: spec.end,
        backgroundColor: spec.color,
        backgroundOpacity: 0.75,
        fontColor: "white",
        fontSize: 14
      };
      var lbl = viewer.addLabel(spec.label, labelOpts);
      if (grp) {
        grp.labelRefs.push(lbl);
        grp.labelSpecs.push({ text: spec.label, opts: labelOpts });
      }
    }
  });

  // ---- Planes: improper rotation / mirror (Sn) symmetry elements ---------
  planes.forEach(function (spec) {
    var shp = viewer.addCustom({
      vertexArr: spec.vertexArr,
      normalArr: spec.normalArr,
      faceArr: spec.faceArr,
      color: spec.color,
      opacity: spec.opacity
    });
    var grp = spec.group ? symGroup(spec.group, spec.color) : null;
    if (grp) { grp.shapes.push(shp); }
    if (spec.label) {
      var labelOpts = {
        position: spec.labelPos,
        backgroundColor: spec.color,
        backgroundOpacity: 0.6,
        fontColor: "white",
        fontSize: 14
      };
      var lbl = viewer.addLabel(spec.label, labelOpts);
      if (grp) {
        grp.labelRefs.push(lbl);
        grp.labelSpecs.push({ text: spec.label, opts: labelOpts });
      }
    }
  });

  // ---- Build the "show/hide Cn / Sn" toggle checkboxes --------------------
  var toggleContainer = document.getElementById("mol3d-72b0b1c7-sym-toggles");
  if (toggleContainer) {
    var groupKeys = Object.keys(symGroups);
    groupKeys.sort(function (a, b) {
      var pa = a.charAt(0), pb = b.charAt(0);
      if (pa !== pb) { return pa === "C" ? -1 : 1; }
      return parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10);
    });
    groupKeys.forEach(function (key) {
      var grp = symGroups[key];

      var wrapper = document.createElement("span");
      wrapper.style.display = "inline-flex";
      wrapper.style.alignItems = "center";
      wrapper.style.marginRight = "14px";
      wrapper.style.marginBottom = "4px";

      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = true;
      cb.id = "mol3d-72b0b1c7-toggle-" + key;
      cb.style.marginRight = "4px";
      cb.style.cursor = "pointer";

      var swatch = document.createElement("span");
      swatch.style.display = "inline-block";
      swatch.style.width = "10px";
      swatch.style.height = "10px";
      swatch.style.marginRight = "4px";
      swatch.style.borderRadius = "2px";
      swatch.style.backgroundColor = grp.color || "#888";

      var lab = document.createElement("label");
      lab.htmlFor = cb.id;
      // lab.textContent = "Show " + key;
      lab.textContent = " " + key;
      lab.style.cursor = "pointer";
      lab.style.userSelect = "none";

      cb.addEventListener("change", function () {
        var visible = cb.checked;
        grp.shapes.forEach(function (s) { s.hidden = !visible; });
        if (visible) {
          grp.labelRefs = grp.labelSpecs.map(function (ls) {
            return viewer.addLabel(ls.text, ls.opts);
          });
        } else {
          grp.labelRefs.forEach(function (l) { viewer.removeLabel(l); });
          grp.labelRefs = [];
        }
        viewer.render();
      });

      wrapper.appendChild(cb);
      wrapper.appendChild(swatch);
      wrapper.appendChild(lab);
      toggleContainer.appendChild(wrapper);
    });
  }

  viewer.zoomTo();
  viewer.render();
  viewer.zoom(1.0, 500);
})();
</script>
<!-- End 3Dmol.js structure viewer -->
